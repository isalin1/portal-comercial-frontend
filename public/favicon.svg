      <stop offset="0%" stop-color="#E21221"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
  </defs>
  <!-- Contenedor transparente centrado -->
  <!-- Isotipo: Pin de ubicación centrado geométricamente -->
