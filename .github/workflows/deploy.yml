name: Deploy namiatech.com

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build Vue App
        run: npm run build

      # 🧹 Limpieza y creación de carpetas en el VPS
      - name: 🧱 Prepare directories on VPS
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.KEY }}
          script: |
            echo "📁 Creando carpetas ..."
            sudo mkdir -p /var/www/html/namiatech.com

            echo "🧹 Limpiando contenido antiguo..."
            sudo rm -rf /var/www/html/namiatech.com/*

            echo "✅ Carpetas listas para recibir archivos."

      # 📤 Despliegue de la app compilada
      - name: 🚀 Upload dist to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.KEY }}
          source: "dist"
          target: "/var/www/html/namiatech.com"
          overwrite: true
          strip_components: 1
